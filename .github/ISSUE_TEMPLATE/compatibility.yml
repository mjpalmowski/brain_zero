name: MultiPlus-II compatibility profile
description: Contribute a sanitized profile from a standalone 230 V inverter.
title: "[Compatibility] "
body:
  - type: markdown
    attributes:
      value: |
        The simplest way to request support is **System → Inverter settings → Submit to developer** inside brain_zero. It submits privately without a GitHub account or file download.

        To contribute publicly through this issue instead, choose **Download compatibility profile** on the same page and attach the downloaded `compatibility.json` below.

        This issue is public. Share only `compatibility.json` and keep the original `.rvsc` private. The workflow uses your profile to open a synthetic file in VEConfigure and inspect the settings for your model and firmware. Once ESS and VEConfigure checks pass, we’ll add that combination to the fully supported list.
  - type: input
    id: inverter
    attributes:
      label: Inverter model
      description: Enter the model from the nameplate. You can include the Victron product code.
      placeholder: MultiPlus-II 24/3000/70-32 230 V
    validations:
      required: true
  - type: input
    id: firmware
    attributes:
      label: Firmware shown by Victron
      description: Enter the full seven-digit VE.Bus number if you know it.
      placeholder: "2611556"
  - type: upload
    id: profile
    attributes:
      label: Downloaded compatibility profile
      description: Attach the compatibility.json file you downloaded from brain_zero.
    validations:
      required: true
      accept: ".json"
  - type: checkboxes
    id: review
    attributes:
      label: Submission review
      options:
        - label: This profile comes from a standalone 230 V MultiPlus-II.
          required: true
        - label: I reviewed the generated profile and agree to share it publicly.
          required: true
