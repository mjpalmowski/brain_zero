name: MultiPlus-II compatibility request
description: Submit a VEConfigure .rvsc backup or a brain_zero compatibility profile.
title: "[Compatibility] "
body:
  - type: markdown
    attributes:
      value: |
        Submit a fresh VEConfigure `.rvsc` backup in a ZIP containing that one file, or attach `compatibility.json` from brain_zero. You can submit a backup before buying a brain_zero.

        **Get a current .rvsc:** With your GX device online in VRM, open your installation → **Device list → Remote VEConfigure → Download**. Wait for the live settings read, then save the original `.rvsc`. Download it again after firmware or settings changes. Zip the unmodified file and attach it below. See the [full instructions](https://github.com/mjpalmowski/brain_zero#download-a-current-rvsc-backup).

        For a sanitized alternative, open **System → Inverter settings → Download compatibility profile** in brain_zero and attach `compatibility.json`.

        GitHub issues and attachments are public. A `.rvsc` backup can contain serial numbers, access credentials and saved settings. Review your file before sharing it.
  - type: input
    id: inverter
    attributes:
      label: Inverter model
      description: Enter the model from the nameplate. You can include the Victron product code.
      placeholder: MultiPlus-II 24/3000/70-32 230 V
    validations:
      required: true
  - type: input
    id: firmware
    attributes:
      label: Firmware shown by Victron
      description: Enter the full seven-digit VE.Bus number if you know it.
      placeholder: "2611556"
  - type: upload
    id: profile
    attributes:
      label: Downloaded compatibility profile
      description: Attach a ZIP containing one fresh .rvsc backup, or compatibility.json downloaded from brain_zero.
    validations:
      required: true
      accept: ".zip,.json"
  - type: checkboxes
    id: review
    attributes:
      label: Submission review
      options:
        - label: This file comes from a standalone 230 V MultiPlus-II.
          required: true
        - label: I reviewed the attachment and agree to share its contents publicly.
          required: true
