name: MultiPlus-II compatibility request
description: Submit a sanitized compatibility.json profile from brain_zero or a local .rvsc backup.
title: "[Compatibility] "
body:
  - type: markdown
    attributes:
      value: |
        Attach only a sanitized `compatibility.json`. You can contribute before buying a brain_zero by converting a fresh `.rvsc` backup locally first.

        **Have a .rvsc backup?** [Submit it through brain-zero.com](https://brain-zero.com/compatibility/). Your browser sanitizes it locally and sends only the profile to our private service. The original file never goes to our server or GitHub, and you do not need to download a tool or use a GitHub account. This issue form is an optional public route for an existing sanitized JSON profile.

        **Using a .rvsc backup:** Download the [local browser sanitizer](https://github.com/mjpalmowski/brain_zero/blob/main/tools/rvsc-sanitizer.html) with **Download raw file**, open the saved HTML file in your browser, and select your `.rvsc`. It removes identifying/private fields on your computer and saves `compatibility.json`. It makes no network requests. See the [fresh-backup instructions](https://github.com/mjpalmowski/brain_zero#download-a-current-rvsc-backup).

        **Using brain_zero:** Open **System → Inverter settings → Download compatibility profile** and attach `compatibility.json`.

        **Do not upload the original .rvsc or a ZIP.** GitHub stores attachments immediately, before automation runs; removing an issue link does not delete the uploaded file. The sanitizer excludes serial numbers, unit IDs, settings-authorization data, saved settings and Assistant contents. Use the generic filename `compatibility.json` and omit serial numbers from the title and issue text. Issues and attachments are public.
  - type: input
    id: inverter
    attributes:
      label: Inverter model
      description: Enter the model from the nameplate. You can include the Victron product code. Do not enter the serial number.
      placeholder: MultiPlus-II 24/3000/70-32 230 V
    validations:
      required: true
  - type: input
    id: firmware
    attributes:
      label: Firmware shown by Victron
      description: Enter the full seven-digit VE.Bus number if you know it.
      placeholder: "2611556"
  - type: upload
    id: profile
    attributes:
      label: Downloaded compatibility profile
      description: Attach only the sanitized compatibility.json, with that exact filename. No .rvsc or ZIP backups.
    validations:
      required: true
      accept: ".json"
  - type: checkboxes
    id: review
    attributes:
      label: Submission review
      options:
        - label: This file comes from a standalone 230 V MultiPlus-II.
          required: true
        - label: I reviewed the attachment and agree to share its contents publicly.
          required: true
        - label: I attached only sanitized compatibility.json and included no serial numbers or original backups.
          required: true
