name: Compatibility profile intake
run-name: 'Compatibility profile intake for issue #${{ github.event.issue.number || inputs.issue_number }}'

on:
  issues:
    types: [opened, edited, reopened]
  workflow_dispatch:
    inputs:
      issue_number:
        description: Issue number to process
        required: true
        type: string

permissions:
  contents: read
  issues: read

jobs:
  intake:
    if: >-
      github.ref_type == 'branch' &&
      github.ref_name == github.event.repository.default_branch &&
      (github.event_name == 'workflow_dispatch' ||
      startsWith(github.event.issue.title, '[Compatibility]') ||
      contains(github.event.issue.body, '### Downloaded compatibility profile'))
    runs-on: ubuntu-latest
    timeout-minutes: 5
    concurrency:
      group: compatibility-intake-${{ github.event.issue.number || inputs.issue_number }}
      cancel-in-progress: false
    steps:
      - name: Check out the workflow revision
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false

      - name: Validate and prepare the profile
        env:
          GITHUB_TOKEN: ${{ github.token }}
        run: python -B tools/intake_compatibility.py --output-dir intake-output

      - name: Upload intake report and validated fixture
        if: ${{ always() && hashFiles('intake-output/report.json') != '' }}
        uses: actions/upload-artifact@cf430e030ddbb5b0abf93d22962f4752f3646cd9 # v7.0.2
        with:
          name: compatibility-intake-${{ github.run_id }}-${{ github.run_attempt }}
          path: |
            intake-output/report.json
            intake-output/profile.json
            intake-output/simulator-profile.json
          if-no-files-found: error
