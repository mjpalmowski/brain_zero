; VE.Bus listener for an ESP32-S3 dev board, flashed and read over the S3's native USB port.
; Build: pio run -d firmware/vebus_listener
[platformio]
default_envs = listener

[env:listener]
platform = espressif32@6.8.1
board = esp32-s3-devkitc-1
framework = arduino
build_flags =
    -DARDUINO_USB_MODE=1
    -DARDUINO_USB_CDC_ON_BOOT=1
    -Wl,-T,ram_budget.ld
monitor_speed = 115200
