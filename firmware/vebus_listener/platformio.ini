; VE.Bus listener for an ESP32-S3 dev board, flashed and read over the S3's native USB port.
; Build: pio run -d firmware/vebus_listener
[platformio]
default_envs = listener

[env:listener]
platform = espressif32@6.8.1
board = esp32-s3-devkitc-1
framework = arduino
lib_deps = h2zero/NimBLE-Arduino@2.3.6
build_flags =
    -DARDUINO_USB_MODE=1
    -DARDUINO_USB_CDC_ON_BOOT=1
    -Wl,-T,ram_budget.ld
    -DCONFIG_BT_NIMBLE_MAX_CONNECTIONS=2
    -DCONFIG_BT_NIMBLE_ROLE_CENTRAL=1
    -DCONFIG_BT_NIMBLE_ROLE_OBSERVER=0
    -DCONFIG_BT_NIMBLE_ROLE_PERIPHERAL=0
    -DCONFIG_BT_NIMBLE_ROLE_BROADCASTER=0
    -DCONFIG_BT_NIMBLE_ATT_PREFERRED_MTU=64
    ; This central exposes no local writable characteristics or queued writes.
    -DMYNEWT_VAL_BLE_ATT_SVR_MAX_PREP_ENTRIES=0
monitor_speed = 115200
