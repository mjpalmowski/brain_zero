  <text x="870" y="995" text-anchor="middle" font-family="Arial" fill="#17283d" font-size="21">Common ground · this circuit is not galvanically isolated</text>
  <text x="70" y="1045" font-family="Arial" fill="#17283d" font-size="22">C1: 100 nF between module VCC and GND, close to the IC.</text>
  <text x="70" y="1082" font-family="Arial" fill="#17283d" font-size="22">Disable module A–B termination and external A/B bias. Keep the logic resistors shown.</text>
  <text x="1070" y="1045" font-family="Arial" fill="#17283d" font-size="21">Logical wiring, not a plug view.</text>
  <text x="1070" y="1082" font-family="Arial" fill="#17283d" font-size="21">Use printed contact numbers.</text>
