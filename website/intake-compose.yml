services:
  intake:
    build:
      context: ..
      dockerfile: website/intake/Dockerfile
    container_name: brain-zero-intake
    restart: unless-stopped
    read_only: true
    cap_drop: [ALL]
    security_opt: [no-new-privileges:true]
    mem_limit: 256m
    pids_limit: 64
    tmpfs:
      - /tmp:size=8m,noexec,nosuid
    volumes:
      - /opt/brain-zero/intake-data:/var/lib/brain-zero-intake
    networks:
      - website
networks:
  website:
    external: true
    name: brain-zero_default
