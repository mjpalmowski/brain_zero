limit_req_zone $binary_remote_addr zone=compatibility_uploads:1m rate=20r/m;

server {
    listen 8080;
    server_name _;
    root /usr/share/nginx/html;
    index index.html;
    server_tokens off;
    add_header X-Robots-Tag "noindex, nofollow, noarchive" always;
    add_header X-Content-Type-Options "nosniff" always;
    add_header Referrer-Policy "no-referrer" always;
    add_header X-Frame-Options "DENY" always;
    add_header Content-Security-Policy "default-src 'self'; script-src 'self' 'wasm-unsafe-eval'; style-src 'self' 'sha256-PXtZZkJMMyc18o/DN1ZEFOJ2qEGq95IQbVaJFMOXOb0='; img-src 'self' data: blob:; font-src 'self'; connect-src 'self'; frame-src 'none'; object-src 'none'; base-uri 'none'; frame-ancestors 'none'; form-action 'none'" always;
    add_header Permissions-Policy "camera=(), microphone=(), geolocation=()" always;
    add_header Cache-Control "private, no-store" always;

    location = /api/compatibility {
        client_max_body_size 280k;
        client_body_timeout 15s;
        limit_req zone=compatibility_uploads burst=5 nodelay;
        limit_req_status 429;
        proxy_connect_timeout 3s;
        proxy_read_timeout 20s;
        proxy_pass http://brain-zero-intake:8080;
    }
    location /api/internal/compatibility/ {
        client_max_body_size 2050k;
        client_body_timeout 20s;
        proxy_connect_timeout 3s;
        proxy_read_timeout 25s;
        proxy_pass http://brain-zero-intake:8080;
    }
    location / { try_files $uri $uri/ =404; }
    location ~ /\. { deny all; }
}
